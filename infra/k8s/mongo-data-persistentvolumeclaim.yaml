# Option simple : laisser Minikube provisionner automatiquement
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: portfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName omis → "standard" de Minikube (auto)