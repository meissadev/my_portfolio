services:

  frontend:
    depends_on:
      - backend
    image: ${DOCKER_HUB_USER}/${FRONTEND_IMAGE}:latest
    container_name: portfolio-app
    expose:
      - "80"
    networks:
      - portfolio-network

  backend:
    depends_on:
      - db
    image: ${DOCKER_HUB_USER}/${BACKEND_IMAGE}:latest
    container_name: portfolio-server
    expose:
      - "5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=${PORT}
      - CORS_ORIGIN=${CORS_ORIGIN}
    networks:
      - portfolio-network

  db:
    image: mongo:8.3.1
    container_name: portfolio-mongo
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - portfolio-network

volumes:
  mongo-data:

networks:
  portfolio-network:
    driver: bridge